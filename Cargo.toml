[package]
name = "webrtc-room"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# The server binary. Named after the package because cargo-leptos looks up the
# built executable as target/<profile>/<package-name>, not by bin-target.
[[bin]]
name = "webrtc-room"
path = "src/bin/server.rs"
required-features = ["ssr"]

[dependencies]
# Shared. leptos pulls no features of its own here: cargo-leptos selects `csr`
# for the wasm lib build and `ssr` for the native bin build (see [features]
# and [package.metadata.leptos] below), so the two never meet in one compile.
leptos = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Client-only (wasm)
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos_router = "0.8"
uuid = { version = "1", features = ["v4", "js"] }
web-sys = { version = "0.3", features = [
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcPeerConnectionIceEvent",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcTrackEvent",
    "RtcSignalingState",
    "RtcPeerConnectionState",
    "RtcRtpTransceiver",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "RtcAnswerOptions",
    "RtcOfferOptions",
    "RtcRtpSender",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaDevices",
    "MediaTrackConstraints",
    "Navigator",
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlVideoElement",
    # `srcObject` lives here, not on HtmlVideoElement, and this web-sys version
    # has no Deref chain between the two.
    "HtmlMediaElement",
    "HtmlAudioElement",
    "Element",
    "EventSource",
    "EventSourceInit",
    "MessageEvent",
    "Storage",
    "console",
] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }

# Server-only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
dashmap = "6"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
constant_time_eq = "0.3"
http = "1"

[features]
default = []
# Client side (wasm32 lib build): --no-default-features --features=csr
csr = ["leptos/csr"]
# Server side (native bin build): --no-default-features --features=ssr.
# leptos/ssr implies leptos/hydration, which is what provides AutoReload and
# HydrationScripts for the HTML shell.
ssr = ["leptos/ssr"]

# ─── cargo-leptos (single-crate setup) ───────────────────────────────────────
# One crate holds both halves: the lib target builds to wasm, the `webrtc-room`
# bin target builds natively. Run `cargo leptos watch` in dev (live reload), or
# `cargo leptos serve` for a one-shot build-and-run.
[package.metadata.leptos]
# Drives the wasm/js/css file names and the /pkg/ URLs in the shell.
output-name = "webrtc-room"
bin-target = "webrtc-room"

# All output lands here and is wiped on every rebuild — do not put hand-written
# files in it. The server writes index.html into it at startup.
site-root = "target/site"
site-pkg-dir = "pkg"

# Plain CSS, passed through Lightning CSS for the browserquery target.
style-file = "style/main.css"
browserquery = "defaults"

# Dev bind address + live-reload port. cargo-leptos exports these as
# LEPTOS_SITE_ADDR / LEPTOS_RELOAD_PORT, and the server reads them back.
site-addr = "127.0.0.1:3000"
reload-port = 3001

# Per-target feature selection — the trick that keeps this a single crate.
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["csr"]
lib-default-features = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
