# coturn configuration for WebRTC Room
# Copy to /etc/coturn/turnserver.conf or mount into container

listening-port=3478
tls-listening-port=5349

# Replace with your server's public IP
# external-ip=203.0.113.1
listening-ip=0.0.0.0

realm=turn.localhost

# Ephemeral HMAC auth (matches TURN_SECRET env var in app)
use-auth-secret
static-auth-secret=dev-secret-change-me

# Relay port range (open these UDP ports on firewall)
min-port=49152
max-port=65535

# Security
no-multicast-peers
no-cli
fingerprint

# Logging
log-file=/var/log/turnserver.log
verbose

# TLS (required for TURN over TCP, optional for UDP-only)
# cert=/etc/letsencrypt/live/yourdomain/fullchain.pem
# pkey=/etc/letsencrypt/live/yourdomain/privkey.pem
